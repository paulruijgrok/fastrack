# Example FASTrack configuration.
#
#   fast -d examples/unloaded_motility/micromanager_tifs --config config.example.toml
#
# Every section and key is optional — only the keys you set are applied; the
# rest keep their defaults. Any explicit CLI flag overrides the value here, and
# multiple --config files layer left-to-right. Requires Python 3.11+ (tomllib).

[hardware]
pixel_size_nm = 80.65                 # camera pixel size (nm)
max_inter_frame_distance_nm = 2016.25 # linking gate: max travel between frames (nm)
# frame_rate_hz = 2.19                # acquisition rate (Hz); forces uniform timing
                                      #   (overrides metadata.txt). REQUIRED for TIFF stacks.

[analysis]
num_frames_ave = 5
min_path_length = 5
percent_tolerance = 500
stuck_velocity_nm_s = 80.0            # avg path velocity below this -> "stuck"
overlap_score_cutoff = 0.4
log_area_score_cutoff = 1.0
diff_log_area_score_cutoff = 0.5
fit_function = "none"                 # none | exp | uyeda
detection_algorithm = "entropy"       # entropy | ridge | ridge-fast
                                      #   ridge      -> fastrack[ridge]
                                      #   ridge-fast -> fastrack[ridge-fast] (~4x faster, identical)
tracking_algorithm = "greedy"
legacy_linking = false
fast_rank = true
morph_contrast = false

[plotting]
# Figures take their look from a theme (src/fastrack/viz/themes/*.toml):
# "default", "legacy" (original FAST look), "paper", or a path to your own
# .toml that starts with  extends = "default".  See docs/plotting.md.
theme = "default"
# formats = ["png", "pdf", "svg"]     # summary figures (default: from the theme)
# skip = ["paths_2D"]                 # figures not to write
xmax = 10000                          # longest filament (nm) in the length-velocity statistics

# Any theme value can be overridden here, per figure or globally:
[plotting.length_velocity]
ymax = 0                              # velocity axis limit (nm/s); 0 = from the data
label_position = "bottom"             # value labels: "bottom" or "top"

[plotting.paths_2D]
style = "velocity"                    # tracks coloured by velocity; "legacy" = original figure
colormap = "blue"                     # "blue", "blue-red" (white = median, on grey) or a matplotlib name
points = true                         # dot at the filament position in each frame
labels = false                        # write each track's velocity (nm/s)
scale_bar_um = 10                     # 0 = none

# [plotting.rc]                       # matplotlib rcParams for every figure
# "font.size" = 12
# [plotting.colors]
# stuck = "0.5"

[runtime]
make_movie = false
overlay_movie = true
cache_layout = "per-frame"            # per-frame (one .npy/frame) | per-movie (one .npz/movie)
input_format = "auto"                 # auto | stack (multi-page .tif) | frames (mm folders)
export_trajectories = false           # write a tidy per-movie trajectory CSV (physical units)
export_contours = false               # also write the skeleton geometry (long-format CSV)
# nprocs = 8                          # default: all cores

[ridge]                               # used by both "ridge" and "ridge-fast"
line_widths = [3]
low_contrast = 50.0
high_contrast = 150.0
min_len = 10.0
max_len = 0.0                         # 0 = no upper limit
dark_line = false                     # false = bright filaments on dark background
estimate_width = true
min_snr = 0.0                         # drop ridges below min_snr x pixel noise (0 = off);
                                      #   ~3 with [preprocess] on low-SNR data

[preprocess]                          # opt-in illumination / low-SNR correction
enabled = false                       # fast --preprocess / fastplus --preprocess
background = "median"                 # median | mean | none (static-background model)
model_frames = 0                      # 0 = fit on all frames; N = N evenly spaced frames
flat_sigma = 50.0                     # gain-field Gaussian sigma (px); 0 = no flat-field
denoise_sigma = 0.8                   # post-correction denoise sigma (px); 0 = off
clip_hi_pct = 99.9                    # movie-wide percentile mapped to full scale

[overlay]                             # styling for the --overlay-movie output
fps = 10.0
frame_label = true                    # frame number, bottom-left
time_label = true                     # mm:ss, bottom-right
frame_interval_s = 1.0                # seconds/frame when no acquisition metadata
font_scale = 0.6
