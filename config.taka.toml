# Taka low-SNR motility data (04302026 Motility Experiment).
# In-pipeline preprocessing + ridge detector, same recipe as the July
# script-route run (tools/preprocess_lowsnr.py + fast --detector ridge).
#   fast -d '<slide dir>' -f --config config.taka.toml
# Requires Python 3.11+ (tomllib) -> use the fastrack-ridge conda env.

[hardware]
pixel_size_nm = 80.65        # TODO: confirm against Taka's objective/camera

[analysis]
detection_algorithm = "ridge"

[ridge]
line_widths = [3, 5]
low_contrast = 18.0
high_contrast = 50.0
min_len = 12.0

[preprocess]
enabled = true
background = "median"
model_frames = 0
flat_sigma = 50.0
denoise_sigma = 0.8
clip_hi_pct = 99.9
