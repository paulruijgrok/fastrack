# Taka low-SNR motility data (04302026 Motility Experiment).
# In-pipeline preprocessing + ridge detector with the signal-to-noise filter
# (tuned 2026-10-16; see docs/preprocessing.md "Detection on corrected data").
# The 2026-10-09 batch run used low/high_contrast 18/50, min_len 12, no min_snr,
# which traced background noise on the dimmer movies (~2000 ridges/frame).
#   fast -d '<slide dir>' -f --config config.taka.toml
# Requires Python 3.11+ (tomllib) -> use the fastrack-ridge conda env.

[hardware]
pixel_size_nm = 80.65        # TODO: confirm against Taka's objective/camera

[analysis]
detection_algorithm = "ridge"

[ridge]
line_widths = [3, 5]
low_contrast = 60.0
high_contrast = 120.0
min_len = 8.0                # px; taka filaments are short
min_snr = 3.0                # drop ridges below 3x the movie's pixel noise

[preprocess]
enabled = true
background = "median"
model_frames = 0
flat_sigma = 50.0
denoise_sigma = 0.8
clip_hi_pct = 99.9
